<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 代码追踪系统 - 架构图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }

        .btn-secondary {
            background: #2196F3;
            color: white;
        }

        .btn-secondary:hover {
            background: #0b7dda;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }

        .canvas-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 1400px;
            width: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .legend {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .legend-text {
            font-size: 14px;
            color: #333;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }
            .canvas-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI 代码追踪系统架构图</h1>
        <p>三层架构设计：插件层 → 后端层 → 前端层</p>
    </div>

    <div class="controls">
        <button class="btn btn-primary" onclick="exportAsPNG()">导出为 PNG</button>
        <button class="btn btn-secondary" onclick="exportAsSVG()">导出为 SVG</button>
    </div>

    <div class="canvas-container">
        <canvas id="architectureCanvas"></canvas>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(135deg, #e1f5ff 0%, #b3e5fc 100%);"></div>
                <span class="legend-text">插件层 (Cursor Extension)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(135deg, #fff4e1 0%, #ffe0b2 100%);"></div>
                <span class="legend-text">后端层 (Node.js + Express)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);"></div>
                <span class="legend-text">前端层 (React + Vite)</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('architectureCanvas');
        const ctx = canvas.getContext('2d');

        // 设置高分辨率 Canvas
        const scale = window.devicePixelRatio || 1;
        const width = 1200;
        const height = 900;
        canvas.width = width * scale;
        canvas.height = height * scale;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(scale, scale);

        // 颜色配置
        const colors = {
            plugin: {
                bg: ['#e1f5ff', '#b3e5fc'],
                border: '#0288d1',
                text: '#0288d1'
            },
            backend: {
                bg: ['#fff4e1', '#ffe0b2'],
                border: '#f57c00',
                text: '#f57c00'
            },
            frontend: {
                bg: ['#e8f5e9', '#c8e6c9'],
                border: '#388e3c',
                text: '#388e3c'
            },
            component: '#ffffff',
            text: '#333333',
            subtext: '#888888',
            arrow: '#333333'
        };

        // 绘制渐变背景
        function drawGradientRect(x, y, w, h, color1, color2, borderColor) {
            const gradient = ctx.createLinearGradient(x, y, x + w, y + h);
            gradient.addColorStop(0, color1);
            gradient.addColorStop(1, color2);
            
            ctx.fillStyle = gradient;
            ctx.strokeStyle = borderColor;
            ctx.lineWidth = 4;
            
            // 绘制圆角矩形
            const radius = 12;
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + w - radius, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
            ctx.lineTo(x + w, y + h - radius);
            ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
            ctx.lineTo(x + radius, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        // 绘制组件框
        function drawComponent(x, y, w, h, title, subtitle) {
            // 阴影
            ctx.shadowColor = 'rgba(0, 0, 0, 0.1)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 2;
            
            // 背景
            ctx.fillStyle = colors.component;
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 2;
            const radius = 8;
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + w - radius, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
            ctx.lineTo(x + w, y + h - radius);
            ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
            ctx.lineTo(x + radius, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // 重置阴影
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            
            // 标题
            ctx.fillStyle = colors.text;
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(title, x + w/2, y + h/2 - 8);
            
            // 副标题
            if (subtitle) {
                ctx.fillStyle = colors.subtext;
                ctx.font = '12px Arial';
                ctx.fillText(subtitle, x + w/2, y + h/2 + 10);
            }
        }

        // 绘制箭头
        function drawArrow(x1, y1, x2, y2, label = '') {
            ctx.strokeStyle = colors.arrow;
            ctx.fillStyle = colors.arrow;
            ctx.lineWidth = 2;
            
            // 箭头线
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            
            // 箭头头部
            const angle = Math.atan2(y2 - y1, x2 - x1);
            const arrowLength = 12;
            const arrowWidth = 8;
            
            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(
                x2 - arrowLength * Math.cos(angle) - arrowWidth * Math.sin(angle),
                y2 - arrowLength * Math.sin(angle) + arrowWidth * Math.cos(angle)
            );
            ctx.lineTo(
                x2 - arrowLength * Math.cos(angle) + arrowWidth * Math.sin(angle),
                y2 - arrowLength * Math.sin(angle) - arrowWidth * Math.cos(angle)
            );
            ctx.closePath();
            ctx.fill();
            
            // 标签
            if (label) {
                ctx.fillStyle = colors.arrow;
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const midX = (x1 + x2) / 2;
                const midY = (y1 + y2) / 2;
                ctx.fillText(label, midX + 40, midY);
            }
        }

        // 绘制右箭头
        function drawRightArrow(x, y) {
            ctx.fillStyle = colors.arrow;
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('→', x, y);
        }

        // 绘制文本
        function drawText(text, x, y, fontSize, color, align = 'center', bold = false) {
            ctx.fillStyle = color;
            ctx.font = `${bold ? 'bold ' : ''}${fontSize}px Arial`;
            ctx.textAlign = align;
            ctx.textBaseline = 'middle';
            ctx.fillText(text, x, y);
        }

        // 绘制整个架构图
        function drawArchitecture() {
            ctx.clearRect(0, 0, width, height);
            
            const layerWidth = 1100;
            const layerHeight = 180;
            const startX = (width - layerWidth) / 2; // 居中计算
            const componentWidth = 160;
            const componentHeight = 60;
            const arrowGap = 30; // 组件之间箭头的间隙
            const verticalGap = 50; // 层与层之间的间隙
            
            // ===== 插件层 =====
            let y = 50;
            drawGradientRect(startX, y, layerWidth, layerHeight, 
                colors.plugin.bg[0], colors.plugin.bg[1], colors.plugin.border);
            
            // 插件层标题
            drawText('插件层 (Cursor Extension)', startX + 30, y + 25, 18, colors.plugin.text, 'left', true);
            
            // 插件层组件 - 4个组件，3个箭头
            const plugin4Total = 4 * componentWidth + 3 * arrowGap;
            let compX = startX + (layerWidth - plugin4Total) / 2;
            let compY = y + 60;
            
            drawComponent(compX, compY, componentWidth, componentHeight, 'Cursor IDE', '代码编辑器');
            compX += componentWidth + arrowGap / 2;
            drawRightArrow(compX, compY + componentHeight / 2);
            compX += arrowGap / 2;
            
            drawComponent(compX, compY, componentWidth, componentHeight, 'stop.js 脚本', '钩子处理器');
            compX += componentWidth + arrowGap / 2;
            drawRightArrow(compX, compY + componentHeight / 2);
            compX += arrowGap / 2;
            
            drawComponent(compX, compY, componentWidth, componentHeight, 'Git Diff', '差异捕获');
            compX += componentWidth + arrowGap / 2;
            drawRightArrow(compX, compY + componentHeight / 2);
            compX += arrowGap / 2;
            
            drawComponent(compX, compY, componentWidth, componentHeight, '压缩编码', 'Gzip + Base64');
            
            // 插件层到后端层的箭头
            const centerX = startX + layerWidth / 2;
            drawArrow(centerX, y + layerHeight, 
                     centerX, y + layerHeight + verticalGap, 'HTTP POST');
            
            // ===== 后端层 =====
            y = y + layerHeight + verticalGap;
            drawGradientRect(startX, y, layerWidth, layerHeight + 80, 
                colors.backend.bg[0], colors.backend.bg[1], colors.backend.border);
            
            // 后端层标题
            drawText('后端层 (Node.js + Express)', startX + 30, y + 25, 18, colors.backend.text, 'left', true);
            
            // 后端层组件 - 第一行：3个组件
            const backend3Total = 3 * componentWidth + 2 * arrowGap;
            compX = startX + (layerWidth - backend3Total) / 2;
            compY = y + 60;
            
            drawComponent(compX, compY, componentWidth, componentHeight, 'API 接收', 'POST /api/create-task');
            compX += componentWidth + arrowGap / 2;
            drawRightArrow(compX, compY + componentHeight / 2);
            compX += arrowGap / 2;
            
            drawComponent(compX, compY, componentWidth, componentHeight, '数据验证', '格式检查');
            compX += componentWidth + arrowGap / 2;
            drawRightArrow(compX, compY + componentHeight / 2);
            compX += arrowGap / 2;
            
            drawComponent(compX, compY, componentWidth, componentHeight, 'SQLite 数据库', '持久化存储');
            
            // 后端层组件 - 第二行：2个组件
            const backend2Total = 2 * componentWidth + arrowGap;
            compX = startX + (layerWidth - backend2Total) / 2;
            compY = y + 60 + componentHeight + 30;
            
            drawComponent(compX, compY, componentWidth, componentHeight, '代码归属分析', '内容哈希匹配');
            compX += componentWidth + arrowGap / 2;
            drawRightArrow(compX, compY + componentHeight / 2);
            compX += arrowGap / 2;
            
            drawComponent(compX, compY, componentWidth, componentHeight, 'API 响应', 'JSON 数据');
            
            // 后端层到前端层的箭头
            drawArrow(centerX, y + layerHeight + 80, 
                     centerX, y + layerHeight + 80 + verticalGap, 'HTTP GET');
            
            // ===== 前端层 =====
            y = y + layerHeight + 80 + verticalGap;
            drawGradientRect(startX, y, layerWidth, layerHeight, 
                colors.frontend.bg[0], colors.frontend.bg[1], colors.frontend.border);
            
            // 前端层标题
            drawText('前端层 (React + Vite)', startX + 30, y + 25, 18, colors.frontend.text, 'left', true);
            
            // 前端层组件 - 3个组件
            compX = startX + (layerWidth - backend3Total) / 2;
            compY = y + 60;
            
            drawComponent(compX, compY, componentWidth, componentHeight, '项目列表页', '统计概览');
            compX += componentWidth + arrowGap / 2;
            drawRightArrow(compX, compY + componentHeight / 2);
            compX += arrowGap / 2;
            
            drawComponent(compX, compY, componentWidth, componentHeight, '文件详情页', '逐行分析');
            compX += componentWidth + arrowGap / 2;
            drawRightArrow(compX, compY + componentHeight / 2);
            compX += arrowGap / 2;
            
            drawComponent(compX, compY, componentWidth, componentHeight, '可视化展示', '颜色标识');
        }

        // 导出为 PNG
        function exportAsPNG() {
            const link = document.createElement('a');
            link.download = 'ai-stats-architecture.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 导出为 SVG
        function exportAsSVG() {
            // 创建一个临时 canvas 用于 SVG 转换
            const svgCanvas = document.createElement('canvas');
            svgCanvas.width = canvas.width;
            svgCanvas.height = canvas.height;
            const svgCtx = svgCanvas.getContext('2d');
            svgCtx.drawImage(canvas, 0, 0);
            
            // 将 canvas 转换为图片并嵌入 SVG
            const imgData = canvas.toDataURL('image/png');
            const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg width="${canvas.width / scale}" height="${canvas.height / scale}" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <image width="${canvas.width / scale}" height="${canvas.height / scale}" xlink:href="${imgData}"/>
</svg>`;
            
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = 'ai-stats-architecture.svg';
            link.href = url;
            link.click();
            URL.revokeObjectURL(url);
        }

        // 响应式处理
        window.addEventListener('resize', () => {
            drawArchitecture();
        });

        // 初始绘制
        drawArchitecture();
    </script>
</body>
</html>
